; Configuración de Flameshot para el entorno Caelestia-Wayfire.
;
; uiColor/contrastUiColor sustituyen el morado de fábrica (#740096 / #270032)
; por el marrón dorado del esquema del entorno: es el `primary` de Caelestia
; (rosepine dawn), el mismo color con el que la barra pinta el workspace
; activo (Colours.palette.m3primary en ActiveIndicator.qml).
;
; OJO: el esquema de Caelestia se regenera a partir del fondo de pantalla, así
; que este valor es una foto fija del `primary` actual. Si algún día cambias de
; esquema y quieres que Flameshot le siga, actualiza estas dos claves con el
; campo "primary" de ~/.local/state/caelestia/scheme.json.
;
; Flameshot reescribe este fichero al tocar ajustes desde su propia GUI.
[General]
checkForUpdates=false
contrastOpacity=188
contrastUiColor=#2d2608
disabledTrayIcon=false
jpegQuality=95
saveAsFileExtension=png
savePath=__HOME__/Imágenes/Screenshots
showHelp=false
showStartupLaunchMessage=false
uiColor=#897324
